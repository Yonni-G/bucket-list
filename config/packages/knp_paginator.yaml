knp_paginator:
  page_range: 5                      # Nombre de pages visibles autour de la page actuelle
  default_options:
    page_name: page                 # Nom du paramètre GET pour la pagination
    sort_field_name: sort           # Nom du paramètre GET pour le tri
    sort_direction_name: direction  # Nom du paramètre GET pour la direction du tri
  template:
    pagination: '@KnpPaginator/Pagination/sliding.html.twig' # Template de pagination utilisé
    sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'
